<style>

button,select,input,textarea{font:inherit;color:inherit}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}

.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}.sc b{display:block;font-size:22px}.sc span{color:var(--mut);font-size:12.5px}

.cr{display:flex;gap:4px;align-items:center}.st{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;padding:1px 6px;font-size:12px;white-space:nowrap}
.cell.dn textarea{text-decoration:line-through;opacity:.6}.cell.dn{background:color-mix(in srgb,var(--acc2) 14%,var(--bg))}.cell.pe{background:color-mix(in srgb,#f59e0b 13%,var(--bg))}
.tmr{display:flex;gap:4px;align-items:center}.tmr input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 3px;font-size:12.5px}
.tmr+small{color:var(--mut);font-weight:400}.ft td{background:var(--hd);font-size:13px;font-weight:600;text-align:center}
.sub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}.sub h3{margin:0 0 8px;font-size:15px}
.sr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.sr input[type=text]{width:170px}.sr input[type=color]{width:36px;height:30px;border:0;background:none;padding:0}
.cell.now{box-shadow:0 0 0 2px var(--acc);position:relative}.cell.now::after{content:"● NOW";position:absolute;top:-9px;right:8px;background:var(--acc);color:#fff;font-size:10px;padding:0 6px;border-radius:6px}
.cr select{min-width:0;flex:1}.ri{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.ri i{width:10px;height:10px;border-radius:3px;flex:none}.ri span{flex:1}.ri em{font-style:normal;color:var(--mut);font-size:12px}.od{color:#e5484d!important;font-weight:600}
.sc input{font-size:18px;font-weight:700;width:64px;display:inline-block}
.clk{text-align:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:8px 16px;min-width:230px}
.clk b{font-size:28px;font-variant-numeric:tabular-nums;display:block;line-height:1.15}.clk #cd{font-size:12.5px;opacity:.95}
.clk #cx{display:inline-block;margin-top:5px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}.clk #cw{font-size:12px;margin-top:3px;font-weight:600}
.clk label{display:block;font-size:12px;margin-top:5px}.clk input{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:8px;color:#fff;padding:1px 4px;font-size:12px;color-scheme:dark}
.syg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px;margin-top:10px}
.scard{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:10px 12px}
.stk{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin:6px 0}.stk i{display:block}
.tp{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.tp .tt{flex:1}.tp.cd .tt{text-decoration:line-through;color:var(--mut)}
.tp select{border-radius:8px;border:1px solid var(--line);padding:1px 4px;font-size:12px;background:var(--card)}
.tgrid{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:20px}@media(max-width:780px){.tgrid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tabs .sp{flex:1}.tmain{text-align:center}.tmain svg{max-width:100%}
.big{font-size:16px;padding:9px 20px}.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chips .btn{padding:3px 10px;font-size:13px}.btn[disabled]{opacity:.45;cursor:not-allowed}.cfg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12.5px;color:var(--mut);margin:8px 0}.cfg input[type=number]{width:54px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 4px}
#tmm{min-height:20px;font-size:13.5px;font-weight:600;color:var(--acc);margin:4px 0}.lap{display:flex;justify-content:space-between;font-size:13px;padding:3px 10px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}.lap.bs{color:#10b981}.lap.ws{color:#e5484d}
.wbx{display:flex;gap:6px;align-items:flex-end;height:80px;margin:8px 0}.wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.wb i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}.wb small{font-size:10.5px;color:var(--mut)}
#fl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;z-index:20;cursor:pointer;background:var(--acc);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
#dn{display:none}
@media(max-width:720px){
.wrap{padding:12px 10px 76px}header{padding:14px}header h1{font-size:19px}.clk{width:100%;min-width:0}
.bar{gap:6px}.wk{min-width:0;flex:1 1 100%;order:-1;font-size:16px}.bar .sp{display:none}.btn{padding:9px 12px}
#dn{display:flex;gap:6px;align-items:center;margin-bottom:8px}.dch{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}.dch .btn{padding:7px 10px;flex:none}
table{min-width:0}.tm{width:108px}.tmr{flex-direction:column;align-items:stretch}.tmr input{font-size:13px}
.cell textarea{font-size:16px;min-height:46px}.in,input[type=number],input[type=text]{font-size:16px}
.tp{flex-wrap:wrap}.tp .tt{min-width:110px}.ri{flex-wrap:wrap}.sum{grid-template-columns:repeat(2,1fr)}.syg{grid-template-columns:1fr}.sr input[type=text]{width:100%}
.tabs .btn{flex:1}.ctl .btn{flex:1 1 40%}.sc b{font-size:19px}}
#hist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}
#hist h3{margin:0 0 8px;font-size:15px}.hi{display:inline-block;margin:3px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:var(--bg)}
.hi:hover{border-color:var(--acc)}#st{font-size:12px;opacity:.9}
</style></head><body><div class="wrap">
<header><div><h1>📅 Weekly Planner</h1><p>SSC CGL 2027 · plan the week, mark done, track your study hours</p></div>
<div class="clk"><b id="ct">--:--:--</b><div id="cd"></div><span id="cx"></span><div id="cw"></div><label>🎯 Exam date <input type="date" id="ex"></label></div>
<div><span id="st"></span> <button class="btn" id="th">🌓</button></div></header>
<div class="bar">
<button class="btn" data-a="prev">◀ Prev</button><div class="wk" id="wk"></div><button class="btn" data-a="next">Next ▶</button>
<button class="btn" data-a="now">This week</button><input type="date" class="btn" id="dp" title="Jump to date">
<span class="sp"></span>
<button class="btn" data-a="copy">⧉ Copy last week</button>
<button class="btn" data-a="edit" id="eb">✎ Edit layout</button>
<button class="btn" data-a="clear">🗑 Clear week</button><button class="btn" data-j="tm">⏱ Timer</button><button class="btn" data-j="syl">📚 Syllabus</button></div>
<input class="goal" id="goal" placeholder="🎯 This week's main goal (e.g. finish Percentage + 2 mocks)">
<div id="sum"></div><div id="rev"></div><div id="sub"></div><div id="dn"></div><div class="tw" id="tw"><table id="tb"></table></div>
<div class="leg" id="leg"></div>
<div class="sub" id="tm" style="margin-top:16px"></div>
<div id="syl"></div>
<div id="hist"><h3>🗂 Previous weeks</h3><div id="hl"></div></div>
</div>
<div id="fl" data-t="go">⏱</div>
<script>
const TAGS0=0;const TAGS=[["Quant","#4f7cff"],["Reasoning","#a855f7"],["English","#10b981"],["GA / GK","#f59e0b"],["Revision","#06b6d4"],["Mock / PYQ","#ef4444"],["Class","#ec4899"],["Break","#94a3b8"]];
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const defS=()=>({cols:DAYS.map((n,i)=>({id:"d"+i,name:n,day:i})),
 rows:["06:00–08:00","08:00–10:00","10:00–12:00","12:00–13:00","14:00–16:00","16:00–18:00","18:00–20:00","20:00–22:00"].map(l=>({id:uid(),label:l})),weeks:{},tags:defT()});
const defT=()=>TAGS.map(t=>({id:t[0],n:t[0],c:t[1],h:t[0]!=='Break'}));
let S=defS(),edit=false,KEY="ssc-planner-v1",dbDoc=null,tmr;
const p2=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const mon=d=>{d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const parse=k=>new Date(k+"T12:00:00");
const add=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return iso(d)};
const thisK=iso(mon(new Date()));let cur=thisK;
const fm=d=>d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const mins=r=>{if(!r.s||!r.e)return 0;const a=r.s.split(":"),b=r.e.split(":");let d=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(d<0)d+=1440;return d};
const fh=m=>Math.floor(m/60)+"h"+(m%60?" "+m%60+"m":"");
const tg=id=>S.tags.find(t=>t.id===id);
function stats(w){const o={p:0,d:0,pe:0,by:{},col:{}};S.rows.forEach(r=>S.cols.forEach(c=>{const v=w.cells[r.id+"|"+c.id];if(!v||!v.k)return;const t=tg(v.k);if(!t||!t.h)return;const m=mins(r);
 o.p+=m;(o.by[t.id]=o.by[t.id]||{p:0,d:0}).p+=m;(o.col[c.id]=o.col[c.id]||{p:0,d:0}).p+=m;
 if(v.s===2){o.d+=m;o.by[t.id].d+=m;o.col[c.id].d+=m}else if(v.s===1)o.pe+=1}));return o}
const W=k=>S.weeks[k]||{cells:{},pts:{},goal:""};
const WW=k=>S.weeks[k]||(S.weeks[k]={cells:{},pts:{},goal:""});
const $=id=>document.getElementById(id);
function status(t){$("st").textContent=t}
function save(){status("Saving…");try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 clearTimeout(tmr);tmr=setTimeout(async()=>{if(dbDoc){try{await dbDoc.set({json:JSON.stringify(S)});status("✓ Saved")}catch(e){status("✓ Saved on this device")}}else status("✓ Saved on this device")},500)}
function has(w){return w&&(Object.values(w.cells).some(c=>c.t||c.k||c.s)||Object.values(w.pts||{}).some(a=>a.length)||w.goal)}
const IV=[1,3,7,21],todayK=()=>iso(new Date());
const isNow=r=>{if(!r.s||!r.e)return false;const n=new Date(),m=n.getHours()*60+n.getMinutes(),a=r.s.split(":"),b=r.e.split(":"),x=+a[0]*60+ +a[1],y=+b[0]*60+ +b[1];return x<=y?(m>=x&&m<y):(m>=x||m<y)};
function doneOn(d){const w=S.weeks[iso(mon(d))];if(!w)return 0;const di=(d.getDay()+6)%7;let t=0;S.cols.forEach(c=>{if(c.day!==di)return;S.rows.forEach(r=>{const v=w.cells[r.id+"|"+c.id];if(v&&v.s===2){const g=tg(v.k);if(g&&g.h)t+=mins(r)}})});return t}
function streaks(){const T=(S.goalH||6)*60,t=new Date();t.setHours(12,0,0,0);let n=0,d=new Date(t);if(doneOn(d)>=T)n++;d.setDate(d.getDate()-1);while(n<2000&&doneOn(d)>=T){n++;d.setDate(d.getDate()-1)}
 const ks=Object.keys(S.weeks).sort();let best=0,run=0;if(ks.length){let x=parse(ks[0]);while(x<=t){if(doneOn(x)>=T){run++;best=Math.max(best,run)}else run=0;x.setDate(x.getDate()+1)}}return{n,best:Math.max(best,n),today:doneOn(t)}}
const dueOf=r=>{const n=r.n||0;if(n>=IV.length)return null;let b=add(r.d,IV[n]);if(r.l&&b<=r.l)b=add(r.l,1);return b};
const dd=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
function addRev(t,k,d){t=(t||"").trim();if(!t)return false;if(S.rev.some(r=>r.t===t&&r.d===d))return true;S.rev.push({id:uid(),t,k:k||"",d:d||todayK(),n:0});return true}
function renderRev(){const T=todayK(),act=S.rev.filter(r=>dueOf(r)),due=act.filter(r=>dueOf(r)<=T).sort((a,b)=>dueOf(a)<dueOf(b)?-1:1),up=act.filter(r=>dueOf(r)>T).sort((a,b)=>dueOf(a)<dueOf(b)?-1:1).slice(0,4),done=S.rev.length-act.length;
 const row=(r,isDue)=>{const g=tg(r.k),dt=dueOf(r),late=dd(T,dt);return "<div class='ri'><i style='background:"+(g?g.c:"var(--mut)")+"'></i><span>"+esc(r.t)+" <em>· revision "+((r.n||0)+1)+"/4"+(isDue?"":" · "+(dd(dt,T)===1?"tomorrow":fm(parse(dt))))+"</em></span>"+(isDue?(late>0?"<em class='od'>"+late+"d overdue</em>":"<em>due today</em>")+"<button class='btn' data-a='revd' data-id='"+r.id+"'>✓ Revised</button>":"")+"<button class='x' data-a='revx' data-id='"+r.id+"' title='Delete'>✕</button></div>"};
 $("rev").innerHTML="<div class='sub'><h3>🔁 Revision reminders · "+(due.length?"<span class='od'>"+due.length+" due</span>":"nothing due 🎉")+" <small style='color:var(--mut);font-weight:400'>(repeats after 1 · 3 · 7 · 21 days)</small></h3>"+due.map(r=>row(r,1)).join("")+(up.length?"<div style='margin-top:8px;color:var(--mut);font-size:12.5px'>Coming up</div>"+up.map(r=>row(r,0)).join(""):"")+
 "<div class='sr' style='margin-top:10px'><input class='in' id='rt' style='flex:1;min-width:180px;width:auto' placeholder='Topic you studied today, e.g. Percentage – shortcuts'><select class='in' id='rs' style='width:auto'><option value=''>subject</option>"+S.tags.map(t=>"<option value='"+t.id+"'>"+esc(t.n)+"</option>").join("")+"</select><button class='btn p' data-a='revadd'>+ Add</button></div><div style='color:var(--mut);font-size:12px'>Tip: press 🔁 on any timetable cell to add its topic here."+(done?" · "+done+" topic"+(done>1?"s":"")+" fully revised ✔":"")+"</div></div>"}
const SST=[["Not started","#94a3b8"],["Studying","#3b82f6"],["Need revision","#a855f7"],["More practice","#f59e0b"],["Completed","#10b981"]];
const STARTER=[[/math|quant/i,"Number System, Percentage, Ratio & Proportion, Average, Profit & Loss, Discount, Simple & Compound Interest, Time & Work, Time Speed Distance, Algebra, Geometry, Mensuration, Trigonometry, Data Interpretation"],[/reason/i,"Analogy, Classification, Series, Coding-Decoding, Blood Relations, Direction Sense, Syllogism, Venn Diagram, Order & Ranking, Puzzles, Non-Verbal Reasoning"],[/english/i,"Reading Comprehension, Cloze Test, Error Spotting, Sentence Improvement, Para Jumbles, Synonyms & Antonyms, One Word Substitution, Idioms & Phrases, Active-Passive, Direct-Indirect"],[/gk|general|aware|gs/i,"History, Geography, Polity, Economy, Physics, Chemistry, Biology, Static GK, Current Affairs, Awards & Books"]];
function addTopics(sb,txt){String(txt||"").split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).forEach(t=>sb.topics.push({id:uid(),t,s:0}))}
const stk=(cn,tot)=>"<div class='stk'>"+SST.map((x,i)=>cn[i]?"<i title='"+x[0]+": "+cn[i]+"' style='width:"+cn[i]/tot*100+"%;background:"+x[1]+"'></i>":"").join("")+"</div>";
function renderSyl(){
 const day=S.exam?dd(S.exam,todayK()):null;let tot=0,cn=[0,0,0,0,0];
 S.syl.forEach(s=>s.topics.forEach(t=>{tot++;cn[t.s||0]++}));
 const rem=tot-cn[4],pct=tot?Math.round(cn[4]/tot*100):0;
 const pace=(day!=null&&day>0&&rem>0)?" · pace needed ≈ <b>"+Math.ceil(rem/Math.max(1,day/7))+" topics/week</b> to finish before the exam":"";
 let h="<div class='sub' style='margin-top:16px'><h3>📚 Syllabus tracker · <span style='color:var(--acc)'>"+pct+"% covered</span> <small style='color:var(--mut);font-weight:400'>("+cn[4]+"/"+tot+" topics"+(cn[2]?" · "+cn[2]+" need revision":"")+(cn[3]?" · "+cn[3]+" need practice":"")+")"+pace+"</small></h3>"+(tot?stk(cn,tot):"")+
